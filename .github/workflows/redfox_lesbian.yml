
name: RedFox Lesbian

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redfox-lesbian
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto pillow google-api-python-client google-auth google-auth-httplib2

      - name: Run RedFox Lesbian
        env:
          BLUESKY_HANDLE: sappicheaven.bsky.social
          BLUESKY_PASSWORD: ${{ secrets.SAPPHICHEAVEN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_MAIN_FOLDER_ID: 1Sv-eqhefclMV25cCH8HFsOjV9BTYa-ag
        run: python redfox_lesbian.py

      - name: Save updated media state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redfox_lesbian_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update RedFox Lesbian media state"
            git push
          fi
