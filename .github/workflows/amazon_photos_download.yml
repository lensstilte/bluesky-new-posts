name: Amazon Photos to Google Drive

on:
  workflow_dispatch:
    inputs:
      amazon_photos_url:
        description: "Plak hier de openbare Amazon Photos albumlink"
        required: true
        type: string
        default: "https://www.amazon.de/photos/share/vyS2twJejhBkUMYtVFmmpMMIr3Zf6oIIZYLnDzoovWn"

permissions:
  contents: read

concurrency:
  group: amazon-photos-to-google-drive
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-api-python-client google-auth

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Download Amazon Photos album and upload to Google Drive
        env:
          AMAZON_PHOTOS_URL: ${{ inputs.amazon_photos_url }}
          GOOGLE_DRIVE_FOLDER_ID: "1mW8vhrdV2N7QjLrIPN6H7K57ZCOVFZMD"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python amazon_photos_downloader.py
