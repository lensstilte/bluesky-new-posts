
name: RedFox New Post

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redfox-new-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto pillow google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Post RedFox media
        env:
          BLUESKY_HANDLE: redheadheaven.bsky.social
          BLUESKY_PASSWORD: ${{ secrets.POST_REDHEADHEAVEN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POST_TEXT: |
            ♥️ @redfoxofficial.bsky.social ♥️
            🦊 onlyfans.com/redfoxofficial 🦊
        run: |
          python new_post_redfox.py

      - name: Save RedFox feed state
        if: always()
        run: |
          if [ -f redfox_feed_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add redfox_feed_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update RedFox feed state"
              git push
              echo "RedFox feed state saved."
            else
              echo "No state changes to save."
            fi
          else
            echo "No RedFox feed state file found."
          fi
