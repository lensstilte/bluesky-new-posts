name: SapphicHeaven RedFoxSH

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sapphicheaven-redfoxsh
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto google-api-python-client google-auth Pillow

      - name: Run RedfoxSH
        env:
          BLUESKY_HANDLE: sapphicheaven.bsky.social
          BLUESKY_PASSWORD: ${{ secrets.SAPPHICHEAVEN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_MAIN_FOLDER_ID: 1MJ8DREkZ8h8Z_F6Ej652TBgjG379mWp5
          SOURCE_ROOT_FOLDER_NAME: redfox
        run: python RedfoxSH.py

      - name: Save 14-day posting state
        if: always()
        run: |
          if [ -f redfox_lesbian_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add redfox_lesbian_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update RedFoxSH posting state"
              git push
            fi
          fi
